spring.application.name=bank-service
server.port=8086

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/bank_system
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.threads.virtual.enabled=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration

# database schema name
spring.flyway.schemas=bank_db

# if schema does not exist, Flyway can create it
spring.flyway.create-schemas=true

# why because flyway and hibernate act differently
spring.jpa.properties.hibernate.default_schema=bank_db